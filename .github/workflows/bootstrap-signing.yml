name: Bootstrap signing key

# One-time setup. RUNNING THIS AGAIN GENERATES A NEW KEY that will not match
# already-published APKs - users would have to uninstall and reinstall the
# extension. The keystore is uploaded as a build artifact (repo-collaborator
# only, 1 day retention); import it into repo secrets, then delete this file.

on:
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    name: Generate signing keystore
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate keystore
        run: |
          STORE_PASS=$(openssl rand -hex 24)
          keytool -genkeypair -v \
            -keystore signingkey.jks \
            -alias erdachi \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -dname "CN=erdachi-extensions"

          SHA256=$(keytool -exportcert -keystore signingkey.jks \
            -alias erdachi -storepass "$STORE_PASS" | sha256sum | cut -d' ' -f1)
          echo "Signing key SHA256: $SHA256"

          mkdir out
          base64 -w0 signingkey.jks > out/signingkey.b64
          echo "$SHA256" > out/signing-key-sha256.txt
          echo "ALIAS=erdachi" > out/alias.txt
          echo "KEY_STORE_PASSWORD=$STORE_PASS" > out/key-store-password.txt
          echo "KEY_PASSWORD=$STORE_PASS" > out/key-password.txt

      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-bootstrap
          path: out/
          retention-days: 1
